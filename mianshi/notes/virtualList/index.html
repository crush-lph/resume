<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .virtual-list-container {
        width: 500px;
        height: 600px;
        position: relative;
        margin: auto;
        background-color: #f0f0f0;
        overflow: auto;
      }
      .virtual-list-phantom {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: -1;
      }
      .virtual-list {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .virtual-list-item {
        width: 100%;
        height: 100%;
        background-color: blue;
        border: 1px solid #ccc;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="virtual-list-container">
      <div class="virtual-list-phantom"></div>
      <div class="virtual-list">
        <div class="virtual-list-item"></div>
      </div>
    </div>
  </body>

  <script>
    const container = document.querySelector(".virtual-list-container");
    const phantom = document.querySelector(".virtual-list-phantom");
    const list = document.querySelector(".virtual-list");
    const itemClassName = "virtual-list-item";

    const total = 1000;
    const itemHeight = 50;
    const listData = Array.from({ length: total }, (_, index) => index);

    const containerHeight = container.clientHeight;
    const visibleCount = Math.ceil(containerHeight / itemHeight) + 2;

    let start = 0;
    let end = start + visibleCount;

    // 撑开滚动区域：总高度 = 条数 × 行高
    phantom.style.height = `${total * itemHeight}px`;

    renderList();

    container.addEventListener("scroll", () => {
      const scrollTop = container.scrollTop;
      start = Math.floor(scrollTop / itemHeight);
      end = Math.min(start + visibleCount, total);
      list.style.transform = `translate3d(0, ${scrollTop - (scrollTop % itemHeight)}px, 0)`;
      renderList();
    });

    function renderList() {
      const fragment = document.createDocumentFragment();
      const visibleData = listData.slice(start, end);

      for (let k = 0; k < visibleData.length; k++) {
        const index = start + k;
        const el = document.createElement("div");
        el.className = itemClassName;
        // el.style.position = "absolute";
        // el.style.top = `${index * itemHeight}px`;
        // el.style.left = "0";
        el.style.width = "100%";
        el.style.height = `${itemHeight}px`;
        el.textContent = String(visibleData[k]);
        fragment.appendChild(el);
      }

      list.replaceChildren(fragment);
    }
  </script>
</html>
